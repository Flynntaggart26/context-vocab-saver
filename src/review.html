<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review — Context Vocab Saver</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="page">
  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-quiz" aria-selected="true">Quiz</button>
      <button role="tab" id="tab-words" aria-selected="false">My words (<span id="words-n">0</span>)</button>
    </nav>

    <!-- QUIZ VIEW -->
    <section id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz">
      <div class="progress"><div id="progress-fill"></div></div>
      <p id="progress-label" class="muted">Loading deck…</p>
      <div class="session-bar">
        <span class="pill streak" title="Doğru serisi (ipucu kullanmadan)">🔥 <b id="streak">0</b></span>
        <span class="pill" title="Öğrenilen kelimeler">✅ <b id="learned-n">0</b>/<span id="total-n">0</span> öğrenildi</span>
      </div>
      <article class="card quiz" id="quiz-card" hidden>
        <p class="muted small" id="quiz-meta"></p>
        <h2 class="quiz-word" id="quiz-word"></h2>
        <p class="quiz-def" id="quiz-def" hidden></p>
        <p class="sentence ctx" id="quiz-sentence"></p>
        <p class="tr" id="quiz-tr" hidden></p>
        <label class="sr-only" for="quiz-input">Türkçe anlamını yaz</label>
        <div class="answer-row">
          <input type="text" id="quiz-input" placeholder="Türkçe anlamını yaz…" autocomplete="off" />
          <button id="btn-check" class="btn primary">Kontrol et</button>
        </div>
        <div class="btn-row">
          <button id="btn-hint" class="btn small">💡 Harf ipucu</button>
        </div>
        <div id="feedback" hidden></div>
      </article>
      <article class="card center" id="done-card" hidden>
        <h2>Deck clear! 🎉</h2>
        <p class="muted">No more words due. Come back tomorrow — or save new words while you read.</p>
      </article>
    </section>

    <!-- WORD LIST VIEW -->
    <section id="view-words" role="tabpanel" aria-labelledby="tab-words" hidden>
      <input type="search" id="search" placeholder="Search words or sentences…" aria-label="Search words" />
      <div id="word-list"></div>
    </section>
  </main>
  <script src="dict-tr.js"></script>
  <script src="translate.js"></script>
  <script src="review.js"></script>
</body>
</html>
