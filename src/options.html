<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <h1>Settings</h1>
  <label class="row"><input type="checkbox" id="opt-double" /> Double-click a word to show the save bubble</label>
  <label class="row"><input type="checkbox" id="opt-remind" /> Daily reminder when reviews are due</label>
  <label class="row">Reminder time: <input type="time" id="opt-hour" value="19:00" /></label>
  <label class="row">Max words per save: <input type="number" id="opt-max" min="1" max="8" value="4" /></label>
  <p id="saved-msg" class="muted" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
